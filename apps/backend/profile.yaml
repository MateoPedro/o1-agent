bio:
  short: "Software Engineer IC4 at Meta, specializing in age assurance at scale and agentic AI tooling. Built systems protecting 50M+ U.S. teenagers and enabled compliance with world-first social media regulation."
  medium: "Software Engineer IC4 at Meta Platforms, working across age assurance and AI infrastructure. Built state-specific age verification systems (Florida, Utah), engineered the world's first Under-16 enforcement flows for Australia's social media law (~544K accounts), and migrated 60+ agentic tools to the Model Context Protocol on the Ads AI team. Promoted from IC3 to IC4 in under a year with two consecutive Exceeds Expectations ratings."
  full: "Software Engineer IC4 at Meta Platforms (San Francisco Bay Area), focused on age assurance infrastructure and agentic AI tooling. On the Age Assurance team, built jurisdiction-aware compliance systems for Florida HB 3 and Utah SB 152 (protecting 5M+ minors), launched the world's first Under-16 enforcement flows under Australia's Online Safety Amendment Act (~544K underage accounts), and engineered anti-circumvention systems preserving safeguarded environments for 50M+ U.S. teenagers. Standardized cross-platform age verification across Facebook, Instagram, and Threads (~20M U.S. users) and designed privacy-preserving storage infrastructure eliminating 100K+ redundant annual verification submissions. Served as System Reliability Champion for a 30+ engineer org and trained 1,000+ engineers as a Meta Bootcamp Presenter. On the Ads AI team, migrated 60+ agentic tools from Python/GraphQL to MCP, improving production response latency by 20%, and built an automated tool detection and registry system for Meta's agentic AI ecosystem. Promoted IC3→IC4 in ~1 year; two consecutive Exceeds Expectations ratings. B.S. Computer Science, Georgia Institute of Technology (Dean's List)."

achievements:
  - "Built Australia Under-16 enforcement flows for the world's first social media regulation of its kind — contributed to ~544K underage account actions across Instagram, Facebook, and Threads"
  - "Engineered anti-circumvention and re-verification systems preserving safeguarded environments for 50M+ U.S. teenagers across Instagram and Facebook"
  - "Built state-specific age verification compliance systems for Florida HB 3 and Utah SB 152, protecting 5M+ minors with infrastructure scalable to 15+ additional U.S. states"
  - "Standardized cross-platform age verification across Facebook, Instagram, and Threads — expanded age protection coverage to ~20M U.S. users"
  - "Designed privacy-preserving age verification storage infrastructure eliminating ~100K+ redundant annual verification submissions"
  - "Migrated 60+ agentic tools from Python/GraphQL to MCP — improved production AI response latency by 20%"
  - "Built automated tool detection and registry system for Meta's agentic AI tooling ecosystem"
  - "Promoted IC3→IC4 in ~1 year (typical timeline: 2–3 years); 2x consecutive Exceeds Expectations performance ratings"
  - "Served as System Reliability Champion for a 30+ engineer organization — defined bug SLAs, led SEV reviews, drove incident response"
  - "Selected as Meta Engineering Bootcamp Presenter — delivered SEV response and testing culture training to 1,000+ engineers"

